<!doctype html><meta charset=utf-8>
<style>body{font:14px system-ui;width:240px;padding:10px}input{width:70px}</style>
<div>Chrome 滚动倍率：<input id=m type=number min=0.05 max=1 step=0.05 value=0.5></div>
<div style="margin-top:6px;color:#666">1.0=原始速度，0.5=一半，0.15=最慢</div>
<div id=s style="margin-top:6px;color:#0a0"></div>
<script>
const m=document.getElementById('m'),s=document.getElementById('s');
chrome.storage.sync.get({mult:0.5},o=>{m.value=o.mult;});
m.onchange=()=>{const v=Math.min(1,Math.max(0.05,parseFloat(m.value)||0.5));m.value=v;
  chrome.storage.sync.set({mult:v},()=>{s.textContent='已保存：'+v+'（立即生效）';});};
</script>
